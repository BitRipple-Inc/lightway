---
server: server:27690
mode: udp
ca_cert: "tests/certs/ca.crt"
tun_name: lightway
tun_local_ip: 10.125.0.2
tun_peer_ip: 10.125.0.1
tun_dns_ip: 100.64.0.1
log_level: info
server_dn: goaway.com
user: test
password: test
# inside_mtu: 1350 # Requires CAP_SYS_ADMIN
outside_mtu: 1500
cipher: aes256
enable_pqc: false
enable_tun_iouring: false
# iouring_sqpoll_idle_time: 100ms
iouring_entry_count: 1024
keepalive_interval: 0s
keepalive_timeout: 0s
enable_pmtud: false
# sndbuf: 1.5 MiB
# rcvbuf: 1.5 MiB
generic_insert_cmd: ["tunnel_inserter",
                  "-o", "{outside}",
                  "-c", "{control}",
                  "--stderr-file", "/tmp/brt_client_log.txt",
                  "--local-addr", "10.125.0.2",
                  "--remote-addr", "10.125.0.1",
                  "--local-ports", "9000", "9001", "9002", "9003",
                  "--remote-ports", "9003", "9002", "9001", "9000",
                  "--",
                  "bitripple_tunnel",
                  "-x", "tun-fd={inside}",
                  "-x", "tx-sock-fd={fd0}",
                  "-x", "feedback-tx-sock-fd={fd1}",
                  "-x", "feedback-rx-sock-fd={fd2}",
                  "-x", "rx-sock-fd={fd3}",
                  ]
