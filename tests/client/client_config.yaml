---
server: server:27690
mode: udp
ca_cert: "tests/certs/ca.crt"
tun_name: lightway
tun_local_ip: 100.64.0.6
tun_peer_ip: 100.64.0.5
tun_dns_ip: 100.64.0.1
log_level: info
server_dn: goaway.com
user: user
password: password
outside_mtu: 1500
cipher: aes256
# keyshare: x25519mlkem768
enable_tun_iouring: false
# iouring_sqpoll_idle_time: 100ms
iouring_entry_count: 1024
keepalive_interval: 10s
keepalive_timeout: 30s
keepalive_continuous: true
enable_expresslane: false
enable_pmtud: false
enable_inside_pkt_encoding: true
inside_pkt_codec_stats_interval: 1s
# sndbuf: 1.5 MiB
# rcvbuf: 1.5 MiB
route_mode: default
dns_config_mode: noexec

# LT3-on qualification connection with the release configuration stated explicitly.
servers:
  - server: server:27690
    mode: udp
    server_dn: goaway.com
    cipher: aes256
    inside_pkt_codec:
      type: lt3
      tunnel_args:
        config_item:
          - "log-filter=~30"
          - "fb-engine-block-abandon-time-ms-auto=1"
          - "fb-engine-block-abandon-time-ms-auto-min=10"
          - "fb-engine-block-abandon-time-ms=50"
          - "thread-pool-worker-count=4"
          - "tun-threaded=1"
          - "tunnel-ingress-sa-bufsize=2048"
          - "tunnel-ingress-sa-count=8"
          - "tunnel-ingress-max-ob-size=131072"
          - "tunnel-ingress-coll-count=8"
          - "rx-aggregator-inact-evict-ms=1000"
          - "rx-aggregator-inact-forget-ms=2000"
          - "encoder-mem-limit=268435456"
          - "rx-flow-counters-ring-buffer-size=1024"
          - "encoder-backlog-limit=4"
          - "cb-accum-memblock-size=131072"
          - "tunnel-block-timeout-ms=5"
          - "tunnel-block-inactivity-timeout-ms=1"
          - "fb-packet-size=1280"
          - "packet-payload-size=1280"
          - "fb-engine-pover=0.1"
          - "fb-engine-sqfactor=0"
          - "fb-engine-nadd=0"
          - "min-repair-packets=2"
          - "tx-flow-set-packet-checksums=1"
          - "rx-flow-verify-packet-checksums=1"
          # Finalize unresolved object-ID gaps after five seconds. Setting this to 0
          # disables gap tracking; lt3_plugin then withholds the incomplete receiver
          # metrics snapshot and Lightway reports an empty decoder statistics object.
          - "tunnel-loss-timeout-ms=5000"
          # Check pending gaps once per second. This must remain positive when the
          # loss timeout is positive. It controls observation cadence, not the age threshold.
          - "tunnel-loss-sweep-interval-ms=1000"
          # Treat a backward object-ID jump larger than this as a sender restart and
          # establish a new baseline instead of counting the intervening range as loss.
          - "tunnel-obid-restart-gap=100000"
        encoder_backlog_capacity: 128
        inject_batch_budget: 16
        egress_batch_budget: 16
        codec_idle_reclaimer_enabled: true
        codec_idle_teardown_ms: 150000
        codec_idle_check_ms: 5000
        shutdown_dispose_budget_ms: 1000
        shutdown_fast_mode: true
        logging: off
