---
server: server:27690
mode: udp
ca_cert: "tests/certs/ca.crt"
tun_name: lightway
tun_local_ip: 100.64.0.6
tun_peer_ip: 100.64.0.5
tun_dns_ip: 100.64.0.1
log_level: info
server_dn: goaway.com
user: user
password: password
outside_mtu: 1500
cipher: aes256
enable_pqc: false
enable_tun_iouring: false
# iouring_sqpoll_idle_time: 100ms
iouring_entry_count: 1024
keepalive_interval: 0s
keepalive_timeout: 0s
enable_pmtud: false
# sndbuf: 1.5 MiB
# rcvbuf: 1.5 MiB
route_mode: default
dns_config_mode: noexec

# Server configurations with codec support
servers:
  - server: server:27690
    mode: udp
    server_dn: goaway.com
    cipher: aes256
    inside_pkt_codec:
      type: bitripple
      tunnel_args:
        config_item:
          - "log-filter=~60"
          - "fb-engine-block-abandon-time-ms-auto=0"
          - "thread-pool-worker-count=4"
          - "tun-threaded=1"
        channel_mode: "Unbounded"
        encoder_backlog_capacity: 2048
        logging: off
